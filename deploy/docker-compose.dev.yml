# Environnement de développement : PostgreSQL + SeaweedFS (S3) + Mailpit.
# Usage : docker compose -f deploy/docker-compose.dev.yml up -d
name: immogest-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: immogest
      POSTGRES_USER: immogest
      POSTGRES_PASSWORD: immogest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immogest"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - seaweed:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  seaweed:

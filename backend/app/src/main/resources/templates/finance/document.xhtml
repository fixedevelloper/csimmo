<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title th:text="${d.titre} + ' ' + ${d.numero}">Document</title>
  <style type="text/css">
    @page { size: A4; margin: 22mm 18mm 22mm 18mm;
            @bottom-center { content: "Page " counter(page) " / " counter(pages); font-size: 8pt; color: #555; } }
    body { font-family: Helvetica, Arial, sans-serif; font-size: 10.5pt; line-height: 1.45; color: #111; }
    h1 { font-size: 18pt; text-align: center; margin: 0 0 4pt 0; }
    h2 { font-size: 11pt; margin: 16pt 0 4pt 0; border-bottom: 1px solid #999; padding-bottom: 2pt; }
    .numero { text-align: center; color: #444; margin-bottom: 14pt; }
    p { margin: 0 0 7pt 0; text-align: justify; }
    table.lignes { width: 100%; border-collapse: collapse; margin-top: 4pt; }
    table.lignes td { border: 1px solid #bbb; padding: 3pt 6pt; }
    table.lignes td.libelle { background: #f2f2f2; width: 55%; }
    table.lignes td.valeur { text-align: right; }
    .note { margin-top: 14pt; font-size: 9pt; color: #444; }
    .emission { margin-top: 26pt; }
  </style>
</head>
<body>
  <h1 th:text="${d.titre}">TITRE</h1>
  <div class="numero" th:text="'N° ' + ${d.numero}">N°</div>
  <p th:each="ligne : ${d.corps}" th:text="${ligne}">Corps</p>
  <h2 th:if="${!d.lignes.isEmpty()}" th:text="${d.titreTableau}">Détail</h2>
  <table class="lignes" th:if="${!d.lignes.isEmpty()}">
    <tr th:each="l : ${d.lignes}"><td class="libelle" th:text="${l.libelle}">Libellé</td><td class="valeur" th:text="${l.valeur}">Valeur</td></tr>
  </table>
  <p class="note" th:if="${d.note != null}" th:text="${d.note}">Note</p>
  <p class="emission" th:text="${d.emission}">Émis le</p>
</body>
</html>

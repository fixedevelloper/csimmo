RECU_ESPECES.sujet=Payment received
RECU_ESPECES.corps=Hello {nom}, we received your cash payment of {montant} on {date}. Thank you.
RECU_ESPECES.court=ImmoGest: cash payment of {montant} received on {date}. Thank you.
QUITTANCE_EMISE.sujet=Your rent receipt {numero}
QUITTANCE_EMISE.corps=Hello {nom}, your rent receipt no. {numero} ({montant}) is available in your ImmoGest tenant area.
QUITTANCE_EMISE.court=ImmoGest: rent receipt {numero} ({montant}) available in your area.
RECU_EMIS.sujet=Your payment slip {numero}
RECU_EMIS.corps=Hello {nom}, your payment slip no. {numero} ({montant}) is available in your ImmoGest tenant area. It is not a rent receipt: that one is issued once the instalment is fully paid.
RECU_EMIS.court=ImmoGest: payment slip {numero} ({montant}) available. Not a rent receipt.
TEST.sujet=ImmoGest notification test
TEST.corps=This is a test message sent from ImmoGest. If you can read it, this channel works.
TEST.court=ImmoGest: test message. This channel works.
OTP.court=ImmoGest: your login code is {code}. Do not share it with anyone.
RAPPEL_ECHEANCE.sujet=Reminder: rent due on {date}
RAPPEL_ECHEANCE.corps=Hello {nom}, this is a reminder that your rent of {montant} is due by {date}. Thank you for being on time.
RAPPEL_ECHEANCE.court=ImmoGest: reminder, rent of {montant} due on {date}.
RELANCE_IMPAYE.sujet=Rent unpaid since {date}
RELANCE_IMPAYE.corps=Hello {nom}, your rent of {montant}, due on {date}, has not been paid ({jours} days late). Please settle it soon or contact us if you have a difficulty.
RELANCE_IMPAYE.court=ImmoGest: rent of {montant} due on {date} unpaid ({jours} days late). Please settle it.
MISE_EN_DEMEURE.sujet=Formal notice to pay {numero}
MISE_EN_DEMEURE.corps=Hello {nom}, a formal notice to pay no. {numero} for {montant} has been issued to you. You can read it in your tenant area. Settlement period: {delai} days.
MISE_EN_DEMEURE.court=ImmoGest: formal notice {numero} ({montant}), settle within {delai} days.

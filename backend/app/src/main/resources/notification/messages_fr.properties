RECU_ESPECES.sujet=Paiement reçu
RECU_ESPECES.corps=Bonjour {nom}, nous avons bien reçu votre paiement de {montant} en espèces le {date}. Merci.
RECU_ESPECES.court=ImmoGest : paiement de {montant} reçu en espèces le {date}. Merci.
QUITTANCE_EMISE.sujet=Votre quittance de loyer {numero}
QUITTANCE_EMISE.corps=Bonjour {nom}, votre quittance de loyer n° {numero} ({montant}) est disponible dans votre espace locataire ImmoGest.
QUITTANCE_EMISE.court=ImmoGest : quittance {numero} ({montant}) disponible dans votre espace.
RECU_EMIS.sujet=Votre reçu de paiement {numero}
RECU_EMIS.corps=Bonjour {nom}, votre reçu de paiement n° {numero} ({montant}) est disponible dans votre espace locataire ImmoGest. Il ne vaut pas quittance : celle-ci sera délivrée au paiement complet de l''échéance.
RECU_EMIS.court=ImmoGest : reçu {numero} ({montant}) disponible. Il ne vaut pas quittance.
TEST.sujet=Test de notification ImmoGest
TEST.corps=Ceci est un message de test envoyé depuis ImmoGest. Si vous le lisez, ce canal fonctionne.
TEST.court=ImmoGest : message de test. Ce canal fonctionne.
OTP.court=ImmoGest : votre code de connexion est {code}. Ne le communiquez à personne.
RAPPEL_ECHEANCE.sujet=Rappel : loyer à payer le {date}
RAPPEL_ECHEANCE.corps=Bonjour {nom}, nous vous rappelons que votre loyer de {montant} est à régler au plus tard le {date}. Merci de votre ponctualité.
RAPPEL_ECHEANCE.court=ImmoGest : rappel, loyer de {montant} à payer le {date}.
RELANCE_IMPAYE.sujet=Loyer impayé depuis le {date}
RELANCE_IMPAYE.corps=Bonjour {nom}, votre loyer de {montant}, échu le {date}, n''est pas réglé ({jours} jours de retard). Merci de régulariser rapidement ou de nous contacter si vous rencontrez une difficulté.
RELANCE_IMPAYE.court=ImmoGest : loyer de {montant} échu le {date} impayé ({jours} j de retard). Merci de régulariser.
MISE_EN_DEMEURE.sujet=Mise en demeure de payer {numero}
MISE_EN_DEMEURE.corps=Bonjour {nom}, une mise en demeure de payer n° {numero} vous a été adressée pour un montant de {montant}. Vous pouvez la consulter dans votre espace locataire. Délai de régularisation : {delai} jours.
MISE_EN_DEMEURE.court=ImmoGest : mise en demeure {numero} ({montant}), régularisation sous {delai} jours.

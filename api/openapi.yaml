components:
  schemas:
    ModificationRequete:
      type: object
      properties:
        nom:
          type: string
          maxLength: 200
          minLength: 0
        telephone:
          type: string
          maxLength: 30
          minLength: 0
        email:
          type: string
          maxLength: 200
          minLength: 0
        role:
          type: string
          enum:
          - ADMIN
          - GESTIONNAIRE
          - PROPRIETAIRE_TIERS
          - LOCATAIRE
          - PRESTATAIRE
          - ENCAISSEUR
        actif:
          type: boolean
        deuxFacteursActif:
          type: boolean
      required:
      - nom
      - role
    UtilisateurDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nom:
          type: string
        telephone:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - GESTIONNAIRE
          - PROPRIETAIRE_TIERS
          - LOCATAIRE
          - PRESTATAIRE
          - ENCAISSEUR
        actif:
          type: boolean
        deuxFacteursActif:
          type: boolean
        verrouille:
          type: boolean
    AffectationsRequete:
      type: object
      properties:
        immeubleIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 500
          minItems: 0
      required:
      - immeubleIds
    AffectationsReponse:
      type: object
      properties:
        immeubleIds:
          type: array
          items:
            type: string
            format: uuid
    StatutSignalementRequete:
      type: object
      properties:
        statut:
          type: string
          enum:
          - NOUVEAU
          - EN_COURS
          - RESOLU
          - REJETE
        note:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - statut
    SignalementDto:
      type: object
      properties:
        id:

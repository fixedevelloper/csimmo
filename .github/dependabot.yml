# Mises à jour automatiques groupées : une PR par écosystème et par semaine (évite le bruit), la CI fait foi.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    groups:
      java: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }
    ignore:
      # typescript-eslint (via eslint-config-next) ne gère pas TypeScript 7 ni ESLint 10 ; @types/node suit le Node 22 de la CI et du Dockerfile
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /license-web
    schedule: { interval: weekly }
    groups:
      license-web: { patterns: ["*"] }
    ignore:
      # typescript-eslint (via eslint-config-next) ne gère pas TypeScript 7 ni ESLint 10 ; @types/node suit le Node 22 de la CI et du Dockerfile
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pub
    directory: /mobile
    schedule: { interval: weekly }
    groups:
      mobile: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
  # images épinglées de docker-compose.yml (postgres, caddy, cloudflared, seaweedfs) : sans cela, elles ne seraient plus jamais relevées
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

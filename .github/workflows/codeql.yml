name: CodeQL

# Analyse statique de sécurité (injections, désérialisation, secrets…) du Java et du TypeScript.
#
# DÉSACTIVÉ (déclenchement manuel seulement) : GitHub n'offre le « code scanning » que sur les dépôts publics ou avec GitHub Advanced
# Security ; sur ce dépôt privé l'étape analyze échoue avec « Code scanning is not enabled ». Pour le réactiver, une fois l'une de ces
# conditions remplie, remettre les déclencheurs ci-dessous.
#
# on:
#   push:
#     branches: [main]
#   pull_request:
#   schedule:
#     - cron: "17 3 * * 1"   # chaque lundi : de nouvelles règles peuvent signaler d'anciens défauts
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read          # requis sur un dépôt privé pour lire l'exécution en cours
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        langage: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.langage }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.langage }}
